# Intégration continue.
#
# Deux travaux séparés pour que l'échec dise tout de suite où regarder, et parce
# qu'ils n'ont aucune raison de s'attendre l'un l'autre.
#
# Le travail backend monte un vrai Postgres, y applique le schéma et y charge la
# nomenclature : sans base, les tests d'intégration se sautent, et une suite
# qui se saute en silence ne prouve rien.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — domaine, API, base
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: car-cost

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: 3istor
          POSTGRES_PASSWORD: 3istor
          POSTGRES_DB: 3istor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U 3istor -d 3istor"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      PGPASSWORD: 3istor
      CARCOST_DSN: postgresql://3istor:3istor@127.0.0.1:5432/3istor

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: car-cost/backend/pyproject.toml

      - name: Installer le client Postgres
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Installer le projet
        working-directory: car-cost/backend
        run: pip install -e ".[dev]"

      # Toutes les migrations, dans l'ordre : n'appliquer que la première
      # laisserait passer un code qui lit une table que la CI n'a jamais créée.
      - name: Appliquer le schéma
        run: |
          for migration in backend/migrations/[0-9]*.sql; do
            psql -h 127.0.0.1 -U 3istor -d 3istor -v ON_ERROR_STOP=1 -q \
              -f "$migration"
          done

      # Le script annonce « refusé » pour chaque écriture interdite qu'il a
      # tentée, et WARNING pour une contrainte qui n'a pas tenu. Il sort
      # toujours en 0 : c'est ici qu'on en fait un échec, sinon le contrôle
      # serait décoratif.
      - name: Contrôler les garanties du schéma
        run: |
          rapport=$(psql -h 127.0.0.1 -U 3istor -d 3istor -q \
            < backend/migrations/checks/contraintes.sql 2>&1)
          echo "$rapport"
          if grep -q "WARNING" <<<"$rapport"; then
            echo "::error::une contrainte du schéma ne tient plus"
            exit 1
          fi
          refus=$(grep -c "refusé" <<<"$rapport" || true)
          echo "écritures interdites refusées : $refus"
          if [ "$refus" -ne 32 ]; then
            echo "::error::32 refus attendus, $refus obtenus — un contrôle a disparu"
            exit 1
          fi

      # Deux exécutions du générateur doivent produire les mêmes octets. Sans
      # ce contrôle, rien n'empêche de modifier seeds/ à la main et de faire
      # mentir les valeurs de contrôle.
      - name: Vérifier le déterminisme du générateur
        run: python -m tools.bom_generator --check

      # Même garantie pour les trois Valhalla : masses, carbone et fournisseurs
      # alternatifs sont générés, ils ne doivent pas se retoucher à la main.
      - name: Vérifier le déterminisme de l'import Valhalla
        run: python -m tools.valhalla_import --check

      # La maquette 3D du Multipla est générée elle aussi : chaque pavé y pèse
      # exactement la quantité de matière de la nomenclature (ADR-0017).
      - name: Vérifier le déterminisme de la maquette 3D
        run: python -m tools.body_model --check

      - name: Charger la nomenclature
        run: |
          python -m carcost.infrastructure seeds \
            | psql -h 127.0.0.1 -U 3istor -d 3istor -v ON_ERROR_STOP=1 -q

      - name: Tests
        run: python -m pytest backend

      # Si la base était injoignable, les tests d'intégration se seraient
      # sautés et la suite serait verte pour rien.
      - name: Aucun test d'intégration sauté
        run: |
          python -m pytest backend/tests/integration -q --no-header 2>&1 | tee resultat.txt
          if grep -qi "skipped" resultat.txt; then
            echo "::error::les tests d'intégration ont été sautés : la base n'était pas joignable"
            exit 1
          fi

  frontend:
    name: Front — écran
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: car-cost/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: car-cost/frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      # Le front tient sa promesse par les types : un montant est une chaîne,
      # et l'arithmétique y est impossible par construction.
      - name: Vérifier les types
        run: npx tsc --noEmit

      - name: Tests
        run: npm test
